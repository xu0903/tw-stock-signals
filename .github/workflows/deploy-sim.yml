# 模擬交易後端自動部署：合併到 main 且改到 supabase/ 時執行，也可以在 Actions 頁手動 Run workflow。
# 需要 repo secret SUPABASE_ACCESS_TOKEN（Supabase 個人存取權杖）；選填 secret SIM_ADMIN_EMAIL。
name: Deploy paper trading

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy-sim.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-sim
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SIM_ADMIN_EMAIL: ${{ secrets.SIM_ADMIN_EMAIL }}
      SIM_ADMIN_PASSWORD: ${{ secrets.SIM_ADMIN_PASSWORD }}
      PROJECT_REF: cvpcgqgpwelokwqltktd
    steps:
      - uses: actions/checkout@v5
      - name: Check secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::請先在 Settings → Secrets and variables → Actions 新增 SUPABASE_ACCESS_TOKEN"; exit 1
          fi
      - run: npm test
      - name: Database (schema, functions, tests, cron)
        run: python3 supabase/deploy.py sql schema auth
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Edge Functions
        run: supabase functions deploy sim-order sim-admin sim-signup sim-match sim-settle sim-refdata --project-ref "$PROJECT_REF" --use-api --yes
      - name: Admin account and reference data
        run: python3 supabase/deploy.py admin refdata
